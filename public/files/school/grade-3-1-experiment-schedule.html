<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --card: #22262e; --border: #2e333c;
    --text: #e8eaed; --sub: #9aa3af; --accent: #ffb84d; --accent-dim: #8a6428;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6; padding: 32px 16px 64px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header h1 { font-size: 26px; letter-spacing: .5px; }
  header h1 em { color: var(--accent); font-style: normal; }
  .sub { color: var(--sub); font-size: 14px; margin-top: 4px; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 18px 0 6px;
  }
  .toolbar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 28px; }
  .legend span { font-size: 12px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  section.week { margin-bottom: 26px; }
  .week-head {
    display: flex; align-items: baseline; gap: 12px;
    border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px;
  }
  .week-head h2 { font-size: 18px; }
  .week-head h2 b { color: var(--accent); font-weight: 700; }
  .week-head .count { color: var(--sub); font-size: 13px; }

  details.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    transition: border-color .15s;
  }
  details.card:hover { border-color: #3d434d; }
  details[open].card { border-color: var(--accent-dim); }
  details.card summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; user-select: none;
  }
  details.card summary::-webkit-details-marker { display: none; }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .when { flex: none; min-width: 108px; }
  .when .d { font-weight: 600; font-size: 15px; }
  .when .s { color: var(--sub); font-size: 12.5px; }
  .course { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where { flex: none; color: var(--sub); font-size: 13px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { flex: none; color: var(--sub); font-size: 12px; transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }

  .body {
    padding: 4px 14px 14px 36px; border-top: 1px dashed var(--border);
    display: grid; grid-template-columns: 88px 1fr; gap: 6px 14px; font-size: 13.5px;
  }
  .body dt { color: var(--sub); }
  .body dd { color: var(--text); }
  .body .note { color: var(--accent); }

  footer { color: var(--sub); font-size: 12px; margin-top: 36px; border-top: 1px solid var(--border); padding-top: 14px; }

  @media (max-width: 640px) {
    .where { display: none; }
    .body { grid-template-columns: 76px 1fr; padding-left: 14px; }
  }
</style>

<script>
const DATA = JSON.parse(document.getElementById('exp-data').textContent);
const DAY_ORDER = ['周一','周二','周三','周四','周五','周六','周日'];

// 课程 -> 色相（色环均分）
const courses = [...new Set(DATA.map(r => r.course))].sort((a,b) => a.localeCompare(b, 'zh'));
const hue = {};
courses.forEach((c, i) => hue[c] = Math.round(i * 360 / courses.length));
const dotColor = c => `hsl(${hue[c]}, 60%, 62%)`;

// 统计
const weeks = [...new Set(DATA.map(r => r.week))].sort((a,b)=>a-b);
document.getElementById('stat').textContent =
  `${DATA.length} 条 · ${courses.length} 门课程 · 第 ${weeks[0]}–${weeks[weeks.length - 1]} 周`;

// 图例
document.getElementById('legend').innerHTML = courses
  .map(c => `<span><i style="background:${dotColor(c)}"></i>${c}</span>`).join('');

// 按周分组渲染
const app = document.getElementById('app');
let html = '';
for (const w of weeks) {
  const rows = DATA.filter(r => r.week === w);
  html += `<section class="week">
    <div class="week-head"><h2>第 <b>${w}</b> 周</h2><span class="count">${rows.length} 条</span></div>`;
  for (const r of rows) {
    html += `<details class="card">
      <summary>
        <span class="dot" style="background:${dotColor(r.course)}"></span>
        <span class="when"><span class="d">${r.day}</span><br><span class="s">第 ${r.secStart}–${r.secEnd} 节</span></span>
        <span class="course">${esc(r.course)}</span>
        <span class="where">${esc(r.room)}</span>
        <span class="chev">▶</span>
      </summary>
      <dl class="body">
        <dt>实验项目</dt><dd>${esc(r.exp)}</dd>
        <dt>上课班级</dt><dd>${esc(r.cls)}</dd>
        <dt>学生人数</dt><dd>${esc(String(r.students ?? '—'))}</dd>
        <dt>每组人数</dt><dd>${esc(String(r.group ?? '—'))}</dd>
        <dt>实验总学时</dt><dd>${esc(String(r.hours ?? '—'))}</dd>
        <dt>开课地点</dt><dd>${esc(r.room)}</dd>
        <dt>指导教师</dt><dd>${esc(r.teacher)}</dd>
        ${r.note ? `<dt>备注</dt><dd class="note">${esc(r.note)}</dd>` : ''}
      </dl>
    </details>`;
  }
  html += `</section>`;
}
app.innerHTML = html;

function esc(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 全部展开 / 折叠
document.getElementById('btn-expand').onclick = () =>
  document.querySelectorAll('details.card').forEach(d => d.open = true);
document.getElementById('btn-collapse').onclick = () =>
  document.querySelectorAll('details.card').forEach(d => d.open = false);
</script>
